name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Secret and raw-session scan
        run: pnpm check:secrets

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - name: Build website
        run: pnpm build

  docker:
    # Builds the production image and smoke-tests it: migrations run, the
    # demo seed loads, and the site serves the catalog.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trace-marketplace:ci .

      - name: Start container with the demo market
        run: docker run -d --name tm -p 3000:3000 -e SEED_DEMO=1 trace-marketplace:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs tm
          exit 1

      - name: Catalog lists the seeded traces
        run: |
          curl -fsS http://localhost:3000/traces -o traces.html
          grep -q "200</strong> trace" traces.html || (docker logs tm; exit 1)

      - name: Container logs
        if: always()
        run: docker logs tm || true
