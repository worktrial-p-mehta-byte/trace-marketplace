name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Secret and raw-session scan
        run: pnpm check:secrets

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - name: Build website
        run: pnpm build

  e2e:
    # The demo script end to end in a real browser, against a production
    # build on its own seeded database (see playwright.config.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build website
        run: pnpm build

      - name: End-to-end tests
        run: pnpm e2e

      - name: Keep traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    # Builds the production image and smoke-tests it: migrations run, the
    # demo seed loads, and the site serves the catalog.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -o pipefail
          if ! docker build --progress=plain -t trace-marketplace:ci . 2>&1 | tee build.log; then
            # Surface the end of the log as an annotation (readable via the API).
            echo "::error title=docker build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Start container with the demo market
        run: docker run -d --name tm -p 3000:3000 -e SEED_DEMO=1 trace-marketplace:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs tm
          exit 1

      - name: Catalog lists the seeded traces
        run: |
          curl -fsS http://localhost:3000/traces -o traces.html
          grep -q "200</strong> trace" traces.html || (docker logs tm; exit 1)

      - name: Container logs
        if: always()
        run: docker logs tm || true
